<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vault — QR Wallet</title>
<meta name="theme-color" content="#060706" id="themeColorMeta">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ===================== THEME TOKENS ===================== */

html[data-theme="obsidian"]{
  --bg:#060706; --bg2:#0d1611; --card:#0f1613; --card2:#0a100d;
  --accent:#00d98b; --accent-2:#8fffce; --accent-soft:rgba(0,217,139,0.16);
  --text:#eef7f2; --text-dim:#8a9a92; --border:#1c2822; --plate:#f4f8f5;
}
html[data-theme="champagne"]{
  --bg:#0c0a08; --bg2:#17130f; --card:#15110d; --card2:#0f0c09;
  --accent:#d4af6a; --accent-2:#f2d9a6; --accent-soft:rgba(212,175,106,0.18);
  --text:#f7f1e6; --text-dim:#a99d87; --border:#2a2118; --plate:#f8f2e4;
}
html[data-theme="sapphire"]{
  --bg:#050810; --bg2:#0b1526; --card:#0c1526; --card2:#080f1c;
  --accent:#5b8fef; --accent-2:#a8c4ff; --accent-soft:rgba(91,143,239,0.18);
  --text:#eef2fb; --text-dim:#8590ab; --border:#182238; --plate:#eef3fb;
}
html[data-theme="rosequartz"]{
  --bg:#0a0708; --bg2:#170e10; --card:#140d0f; --card2:#0f0a0b;
  --accent:#e8a0a0; --accent-2:#ffcccc; --accent-soft:rgba(232,160,160,0.16);
  --text:#f8ecec; --text-dim:#ab8b8d; --border:#2a1a1c; --plate:#faf0ef;
}
html[data-theme="platinum"]{
  --bg:#08090a; --bg2:#131416; --card:#0f1011; --card2:#0a0b0c;
  --accent:#c7ccd1; --accent-2:#eef1f4; --accent-soft:rgba(199,204,209,0.16);
  --text:#f2f3f4; --text-dim:#8b8f93; --border:#202225; --plate:#f4f5f6;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Jost', sans-serif;
  margin:0;
  text-align:center;
  min-height:100vh;
  overflow-x:hidden;
}

::selection{ background:var(--accent-soft); color:var(--text); }

.serif{ font-family:'Cormorant Garamond', serif; }

button{
  font-family:'Jost', sans-serif;
  cursor:pointer;
}

#bgLuxury{
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, var(--accent-soft), transparent 60%),
    linear-gradient(180deg, var(--bg2), var(--bg) 40%);
}

/* ===================== HEADER ===================== */

.brandWrap{ padding:calc(48px + env(safe-area-inset-top)) 20px 8px; }

.wordmark{
  font-family:'Cormorant Garamond', serif;
  font-weight:600;
  font-size:clamp(32px, 9vw, 44px);
  letter-spacing:clamp(6px, 2vw, 10px);
  margin:0;
  color:var(--text);
  opacity:0;
  animation:wordReveal 1s ease forwards 0.15s;
}

.tagline{
  font-size:11px;
  letter-spacing:4px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin:8px 0 0;
  opacity:0;
  animation:wordReveal 1s ease forwards 0.4s;
}

@keyframes wordReveal{
  from{ opacity:0; letter-spacing:14px; transform:translateY(6px); }
  to{ opacity:1; letter-spacing:10px; transform:translateY(0); }
}

.searchWrap{ padding:26px 30px 6px; max-width:420px; margin:0 auto; }

#titleSearch{
  width:100%;
  padding:10px 4px;
  background:transparent;
  color:var(--text);
  border:none;
  border-bottom:1px solid var(--border);
  border-radius:0;
  text-align:center;
  font-family:'Jost', sans-serif;
  font-size:14px;
  letter-spacing:1px;
  transition:border-color .25s ease;
}
#titleSearch::placeholder{ color:var(--text-dim); }
#titleSearch:focus{ outline:none; border-bottom-color:var(--accent); }

/* ===================== CAROUSEL / CARDS ===================== */

.carousel{
  --cardW:min(360px, 84vw);
  display:flex;
  overflow-x:auto;
  gap:22px;
  padding:34px calc((100% - var(--cardW)) / 2) 10px;
  scroll-snap-type:x mandatory;
  scroll-padding-left:calc((100% - var(--cardW)) / 2);
  scroll-padding-right:calc((100% - var(--cardW)) / 2);
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{ display:none; }

.card{
  width:var(--cardW);
  min-width:var(--cardW);
  max-width:var(--cardW);
  flex:0 0 auto;
  border-radius:20px;
  padding:22px;
  scroll-snap-align:center;
  position:relative;
  overflow:hidden;
  text-align:left;
  background:
    linear-gradient(155deg, var(--card) 0%, var(--card2) 100%);
  border:1px solid var(--border);
  box-shadow:0 20px 40px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
  transition:transform .35s cubic-bezier(.2,.7,.2,1);
  opacity:0;
  animation:cardIn .6s ease forwards;
}
.card:nth-child(1){ animation-delay:.05s; }
.card:nth-child(2){ animation-delay:.12s; }
.card:nth-child(3){ animation-delay:.19s; }
.card:nth-child(4){ animation-delay:.26s; }
.card:nth-child(n+5){ animation-delay:.3s; }

@keyframes cardIn{
  from{ opacity:0; transform:translateY(16px) scale(.97); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

.card:active{ transform:scale(0.98); }

/* foil sweep */
.card::after{
  content:"";
  position:absolute;
  top:-50%; left:-60%;
  width:40%; height:200%;
  background:linear-gradient(75deg, transparent, var(--accent-soft) 45%, transparent 65%);
  transform:translateX(-120%) rotate(8deg);
  pointer-events:none;
  transition:transform .9s ease;
}
.card:hover::after, .card:active::after{ transform:translateX(360%) rotate(8deg); }

.cardTopRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.cardChip{
  width:34px; height:24px;
  border-radius:5px;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.cardChip::before{
  content:"";
  position:absolute; inset:4px;
  border:1px solid rgba(0,0,0,0.25);
  border-radius:3px;
}

.cardNumber{
  font-size:11px;
  letter-spacing:2px;
  color:var(--text-dim);
  text-transform:uppercase;
}

.cardDelete{
  position:absolute;
  top:14px; right:14px;
  width:26px; height:26px;
  border-radius:50%;
  background:rgba(0,0,0,0.25);
  border:1px solid var(--border);
  color:var(--text-dim);
  display:flex; align-items:center; justify-content:center;
  font-size:13px;
  line-height:1;
  padding:0;
  z-index:2;
}
.cardDelete:hover{ color:var(--accent); border-color:var(--accent); }

.qrPlate{
  background:var(--plate);
  border-radius:14px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06), 0 10px 24px -12px rgba(0,0,0,0.7);
  min-height:180px;
}

.card img{
  width:100%;
  max-width:220px;
  display:block;
  border-radius:6px;
  background:transparent;
}

.cardTitle{
  font-family:'Cormorant Garamond', serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:1px;
  margin:16px 0 2px;
  color:var(--text);
}

.cardMeta{
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-dim);
}

/* nav + dots */

.navRow{
  display:flex;
  gap:14px;
  justify-content:center;
  margin:22px 0 8px;
}

.navBtn{
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  padding:10px 20px;
  border-radius:30px;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:border-color .2s ease, color .2s ease;
}
.navBtn:hover{ border-color:var(--accent); color:var(--accent); }

.dots{
  display:flex;
  gap:6px;
  justify-content:center;
  margin-bottom:40px;
}
.dot{
  width:6px; height:6px;
  border-radius:50%;
  background:var(--border);
  transition:background .25s ease, transform .25s ease;
}
.dot.active{ background:var(--accent); transform:scale(1.3); }

.emptyState{
  padding:60px 30px;
  color:var(--text-dim);
}
.emptyState .serif{ font-size:24px; color:var(--text); display:block; margin-bottom:10px; }

/* ===================== FLOATING ADD BUTTON ===================== */

#addBtn{
  position:fixed;
  bottom:calc(26px + env(safe-area-inset-bottom));
  right:calc(26px + env(safe-area-inset-right));
  width:58px; height:58px;
  border-radius:50%;
  border:none;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:var(--bg);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 30px -8px var(--accent-soft), 0 4px 10px rgba(0,0,0,0.5);
  z-index:50;
  transition:transform .2s ease;
}
#addBtn:active{ transform:scale(0.92); }
#addBtn svg{ width:22px; height:22px; }

/* ===================== LOCK SCREEN ===================== */

#lockScreen{
  position:fixed; inset:0;
  background:var(--bg);
  display:none;
  align-items:center; justify-content:center;
  flex-direction:column;
  z-index:999;
  gap:14px;
}
#lockScreen h2{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:26px; letter-spacing:2px; }
#lockScreen input{
  width:220px; padding:12px; text-align:center;
  background:transparent; color:var(--text);
  border:none; border-bottom:1px solid var(--border);
  font-family:'Jost', sans-serif; letter-spacing:2px;
}
#lockScreen input:focus{ outline:none; border-bottom-color:var(--accent); }

/* ===================== SETTINGS PANEL ===================== */

#settingsPanel{
  position:fixed; inset:0;
  background:var(--bg);
  z-index:2000;
  transform:translateX(-100%);
  transition:transform 0.4s cubic-bezier(.2,.8,.2,1);
  overflow-y:auto;
}
#settingsPanel.open{ transform:translateX(0); }

.settingsContent{ padding:calc(40px + env(safe-area-inset-top)) 26px calc(60px + env(safe-area-inset-bottom)); text-align:left; max-width:420px; margin:0 auto; }

.settingsHeader{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px;
}
.settingsHeader h2{
  font-family:'Cormorant Garamond', serif; font-weight:600; font-size:24px; letter-spacing:1px; margin:0;
}
.closeX{
  background:none; border:none; color:var(--text-dim); font-size:22px; padding:4px 8px;
}

.sectionLabel{
  font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim);
  margin:34px 0 14px;
}

.themeGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.themeSwatch{
  background:none; border:none; padding:0;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.swatchCircle{
  width:52px; height:52px; border-radius:50%;
  border:2px solid transparent;
  display:flex; align-items:center; justify-content:center;
  transition:border-color .2s ease, transform .2s ease;
}
.swatchCircle.active{ border-color:var(--accent); transform:scale(1.08); }
.swatchInner{ width:38px; height:38px; border-radius:50%; }
.themeSwatch span{ font-size:10px; letter-spacing:1px; color:var(--text-dim); text-align:center; }

.settingsBtn{
  width:100%;
  text-align:left;
  padding:14px 4px;
  background:none;
  border:none;
  border-bottom:1px solid var(--border);
  color:var(--text);
  font-size:14px;
  letter-spacing:1px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.settingsBtn:hover{ color:var(--accent); }
.settingsBtn .arrow{ color:var(--text-dim); }

.dangerBtn{ color:#e08585; }

/* ===================== POPUP (ADD QR) ===================== */

#popup{
  display:none;
  position:fixed; inset:0;
  background:var(--bg);
  padding:26px;
  overflow-y:auto;
  z-index:1500;
  text-align:left;
}
#popup h3{
  font-family:'Cormorant Garamond', serif; font-weight:600; font-size:24px;
  text-align:center; margin:10px 0 26px; letter-spacing:1px;
}

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }

input, select{
  width:100%;
  padding:12px 10px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  font-family:'Jost', sans-serif;
  font-size:14px;
}
input:focus, select:focus{ outline:none; border-color:var(--accent); }
select{ appearance:none; }

#fields > div{ margin-bottom:10px; }

#preview{ margin-top:14px; text-align:center; }
#preview img{ width:60%; max-width:220px; border-radius:10px; background:var(--plate); padding:10px; }

.popupActions{
  display:flex; gap:12px; margin-top:26px;
}

.btnPrimary{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg, var(--accent), var(--accent-2));
  color:var(--bg);
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:600;
}
.btnGhost{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text-dim);
  font-size:13px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.btnSecondary{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  font-size:13px;
  letter-spacing:1px;
  margin-top:8px;
}
.btnSecondary:hover{ border-color:var(--accent); color:var(--accent); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

</style>
</head>

<body>

<div id="bgLuxury"></div>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <h2 class="serif">Enter Password</h2>
  <input type="password" id="unlockPass" placeholder="••••">
  <button class="btnSecondary" style="width:220px" onclick="unlockApp()">Unlock</button>
</div>

<!-- MAIN -->
<div id="main">

  <div class="brandWrap">
    <h1 class="wordmark">VAULT</h1>
    <p class="tagline">A Private QR Wallet</p>
  </div>

  <div class="searchWrap">
    <input id="titleSearch" placeholder="Search your collection">
  </div>

  <div class="carousel" id="qrList"></div>
  <div class="dots" id="dots"></div>

  <div class="navRow">
    <button class="navBtn" onclick="prevCard()">◂ Prev</button>
    <button class="navBtn" onclick="nextCard()">Next ▸</button>
  </div>

</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <div class="settingsContent">

    <div class="settingsHeader">
      <h2 class="serif">Settings</h2>
      <button class="closeX" onclick="closeSettings()">✕</button>
    </div>

    <div class="sectionLabel">Appearance</div>
    <div class="themeGrid" id="themeGrid"></div>

    <div class="sectionLabel">Security</div>
    <button class="settingsBtn" onclick="addPassword()"><span>Add Password Lock</span><span class="arrow">›</span></button>
    <button class="settingsBtn" onclick="removePassword()"><span>Remove Password Lock</span><span class="arrow">›</span></button>

    <div class="sectionLabel">Tools</div>
    <button class="settingsBtn" onclick="openScanner()"><span>Scan a QR Code</span><span class="arrow">›</span></button>

  </div>
</div>

<button id="addBtn" onclick="openPopup()" aria-label="Add QR code">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- POPUP -->
<div id="popup">
  <h3>Add to Vault</h3>

  <div class="field">
    <label>Title</label>
    <input id="qrTitle" placeholder="e.g. Business WiFi">
  </div>

  <div class="field">
    <label>Method</label>
    <select id="qrMode" onchange="modeChange()">
      <option value="upload">Upload QR Image</option>
      <option value="generate">Generate QR</option>
    </select>
  </div>

  <div id="uploadBox">
    <div class="field">
      <label>Image</label>
      <input type="file" accept="image/*" onchange="loadImage(event)">
    </div>
    <div class="field">
      <label>Detected Text</label>
      <input id="qrText" placeholder="Auto-filled after upload">
    </div>
  </div>

  <div id="generatorBox" style="display:none">
    <div class="field">
      <label>Type</label>
      <select id="qrType" onchange="buildFields()">
        <option value="text">Plain Text</option>
        <option value="link">Website Link</option>
        <option value="wifi">WiFi</option>
        <option value="vcard">Contact vCard</option>
      </select>
    </div>

    <div id="fields"></div>

    <button class="btnSecondary" onclick="addRow()">+ Add Field</button>
    <button class="btnSecondary" onclick="generateQR()">Generate Preview</button>

    <div id="preview"></div>
  </div>

  <div class="popupActions">
    <button class="btnGhost" onclick="closePopup()">Cancel</button>
    <button class="btnPrimary" onclick="saveQR()">Save</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>

/* ===================== THEME SYSTEM ===================== */

const THEMES = [
  { id:'obsidian',   name:'Obsidian & Emerald', bg:'#060706', accent:'#00d98b', accent2:'#8fffce' },
  { id:'champagne',  name:'Champagne & Ink',     bg:'#0c0a08', accent:'#d4af6a', accent2:'#f2d9a6' },
  { id:'sapphire',   name:'Midnight Sapphire',   bg:'#050810', accent:'#5b8fef', accent2:'#a8c4ff' },
  { id:'rosequartz', name:'Rose Quartz',         bg:'#0a0708', accent:'#e8a0a0', accent2:'#ffcccc' },
  { id:'platinum',   name:'Platinum Noir',       bg:'#08090a', accent:'#c7ccd1', accent2:'#eef1f4' }
]

function buildThemeGrid(){
  const active = localStorage.getItem('qrWalletTheme') || 'obsidian'
  const grid = document.getElementById('themeGrid')
  grid.innerHTML = ""
  THEMES.forEach(t=>{
    const wrap = document.createElement('button')
    wrap.className = 'themeSwatch'
    wrap.onclick = ()=>setTheme(t.id)
    wrap.innerHTML = `
      <div class="swatchCircle ${t.id===active?'active':''}" style="background:${t.bg}" data-swatch="${t.id}">
        <div class="swatchInner" style="background:linear-gradient(135deg,${t.accent},${t.accent2})"></div>
      </div>
      <span>${t.name}</span>
    `
    grid.appendChild(wrap)
  })
}

function setTheme(id){
  document.documentElement.setAttribute('data-theme', id)
  localStorage.setItem('qrWalletTheme', id)
  const t = THEMES.find(x=>x.id===id)
  if(t) document.getElementById('themeColorMeta').setAttribute('content', t.bg)
  document.querySelectorAll('.swatchCircle').forEach(el=>{
    el.classList.toggle('active', el.dataset.swatch===id)
  })
}

function initTheme(){
  const saved = localStorage.getItem('qrWalletTheme') || 'obsidian'
  setTheme(saved)
  buildThemeGrid()
}

/* ===================== PASSWORD FEATURE ===================== */

function addPassword(){
  let existing=localStorage.getItem("qrPassword")
  if(existing){ alert("Password already exists"); return }
  let pass=prompt("Create password")
  if(!pass || pass.length<4){ alert("Password must be 4+ characters"); return }
  localStorage.setItem("qrPassword",pass)
  alert("Password enabled")
}

function removePassword(){
  let saved=localStorage.getItem("qrPassword")
  if(!saved){ alert("No password set"); return }
  let pass=prompt("Enter current password")
  if(pass===saved){ localStorage.removeItem("qrPassword"); alert("Password removed") }
  else{ alert("Wrong password") }
}

window.onload=function(){
  initTheme()
  let saved=localStorage.getItem("qrPassword")
  if(saved){ lockScreen.style.display="flex" }
}

function unlockApp(){
  let saved=localStorage.getItem("qrPassword")
  if(unlockPass.value===saved){ lockScreen.style.display="none" }
  else{ alert("Wrong password") }
  unlockPass.value=""
}

/* ===================== INDEXED DB ===================== */

let db
let request=indexedDB.open("qrVault",1)

request.onupgradeneeded=e=>{
  db=e.target.result
  db.createObjectStore("qrStore",{keyPath:"id",autoIncrement:true})
}

request.onsuccess=e=>{
  db=e.target.result
  loadQR()
}

/* ===================== MODE SWITCH ===================== */

function modeChange(){
  if(qrMode.value==="upload"){
    uploadBox.style.display="block"
    generatorBox.style.display="none"
  }else{
    uploadBox.style.display="none"
    generatorBox.style.display="block"
    buildFields()
  }
}

/* ===================== QR GENERATOR ===================== */

let generatedData=""
let generatedImage=""

function buildFields(){
  fields.innerHTML=""
  if(qrType.value==="text") addRow("Text")
  if(qrType.value==="link"){ addRow("URL"); addRow("Title") }
  if(qrType.value==="wifi"){ addRow("SSID"); addRow("Password") }
  if(qrType.value==="vcard"){ addRow("Full Name"); addRow("Phone"); addRow("Email"); addRow("Organization") }
}

function addRow(label="Extra"){
  let div=document.createElement("div")
  div.innerHTML=`<input placeholder="${label}">`
  fields.appendChild(div)
}

function generateQR(){
  let vals=[...fields.querySelectorAll("input")].map(i=>i.value)
  let type=qrType.value

  if(type==="text") generatedData=vals.join("\n")
  if(type==="link") generatedData=vals[0]
  if(type==="wifi") generatedData=`WIFI:T:WPA;S:${vals[0]};P:${vals[1]};;`
  if(type==="vcard")
    generatedData=`BEGIN:VCARD\nVERSION:3.0\nFN:${vals[0]}\nTEL:${vals[1]}\nEMAIL:${vals[2]}\nORG:${vals[3]}\nEND:VCARD`

  QRCode.toDataURL(generatedData,{width:600, margin:1, color:{ dark:"#0a0a0a", light:"#ffffff" }},(err,url)=>{
    generatedImage=url
    preview.innerHTML=`<img src="${url}">`
  })
}

/* ===================== UPLOAD QR ===================== */

let tempImg=""

function loadImage(e){
  let file=e.target.files[0]
  let reader=new FileReader()

  reader.onload=function(evt){
    let img=new Image()
    img.src=evt.target.result
    img.onload=function(){
      let canvas=document.createElement("canvas")
      let ctx=canvas.getContext("2d")
      canvas.width=600
      canvas.height=img.height*(600/img.width)
      ctx.drawImage(img,0,0,canvas.width,canvas.height)
      tempImg=canvas.toDataURL("image/jpeg",0.85)
      let data=ctx.getImageData(0,0,canvas.width,canvas.height)
      let code=jsQR(data.data,canvas.width,canvas.height)
      if(code) qrText.value=code.data
    }
  }
  reader.readAsDataURL(file)
}

/* ===================== SAVE ===================== */

function saveQR(){
  let title=qrTitle.value
  if(!title){ alert("Title required"); return }

  let image="", text=""
  if(qrMode.value==="upload"){ image=tempImg; text=qrText.value }
  else{ image=generatedImage; text=generatedData }

  if(!image){ alert("Generate or upload first"); return }

  let tx=db.transaction("qrStore","readwrite")
  tx.objectStore("qrStore").add({title,image,text,dateAdded:Date.now()})
  tx.oncomplete=function(){
    closePopup()
    loadQR()
  }
}

/* ===================== LOAD ===================== */

function loadQR(){
  let tx=db.transaction("qrStore","readonly")
  let req=tx.objectStore("qrStore").getAll()

  req.onsuccess=function(){
    qrList.innerHTML=""

    if(req.result.length===0){
      qrList.innerHTML = `<div class="emptyState"><span class="serif">The vault is empty</span>Add your first QR code to begin.</div>`
      dots.innerHTML=""
      return
    }

    req.result.forEach((item,idx)=>{
      let card=document.createElement("div")
      card.className="card"

      let topRow=document.createElement("div")
      topRow.className="cardTopRow"
      topRow.innerHTML = `<div class="cardChip"></div><div class="cardNumber">No. ${String(idx+1).padStart(3,'0')}</div>`

      let del=document.createElement("button")
      del.className="cardDelete"
      del.innerHTML="✕"
      del.setAttribute("aria-label","Delete")
      del.onclick=function(){ deleteQR(item.id) }

      let plate=document.createElement("div")
      plate.className="qrPlate"
      let img=document.createElement("img")
      img.dataset.src=item.image
      plate.appendChild(img)

      let title=document.createElement("h4")
      title.className="cardTitle"
      title.innerText=item.title

      let meta=document.createElement("div")
      meta.className="cardMeta"
      meta.innerText = item.dateAdded ? "Added " + new Date(item.dateAdded).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}) : "Double-tap to copy"

      let lastTap=0
      img.addEventListener("touchend",function(){
        let now=new Date().getTime()
        if(now-lastTap<300){ copyQR(item.text) }
        lastTap=now
      })
      img.addEventListener("dblclick",function(){ copyQR(item.text) })

      card.appendChild(topRow)
      card.appendChild(del)
      card.appendChild(plate)
      card.appendChild(title)
      card.appendChild(meta)

      qrList.appendChild(card)
    })

    activateLazyLoad()
    buildDots(req.result.length)
  }
}

/* ===================== DOTS / SCROLL SYNC ===================== */

function buildDots(count){
  dots.innerHTML=""
  for(let i=0;i<count;i++){
    let d=document.createElement("div")
    d.className="dot"+(i===0?" active":"")
    dots.appendChild(d)
  }
}

let scrollTicking=false
document.addEventListener("DOMContentLoaded",()=>{
  qrList.addEventListener("scroll",()=>{
    if(scrollTicking) return
    scrollTicking=true
    requestAnimationFrame(()=>{
      const cards=qrList.querySelectorAll(".card")
      if(cards.length){
        const cardWidth=cards[0].offsetWidth+22
        const idx=Math.round(qrList.scrollLeft/cardWidth)
        document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active", i===idx))
      }
      scrollTicking=false
    })
  })
})

/* ===================== LAZY LOAD ===================== */

function activateLazyLoad(){
  const imgs=document.querySelectorAll("img[data-src]")
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.src=e.target.dataset.src
        observer.unobserve(e.target)
      }
    })
  },{root:qrList,threshold:0.5})
  imgs.forEach(img=>observer.observe(img))
}

/* ===================== COPY / DELETE ===================== */

function copyQR(text){
  navigator.clipboard.writeText(text)
  alert("Copied")
}

function deleteQR(id){
  if(!confirm("Remove this from your vault?")) return
  let tx=db.transaction("qrStore","readwrite")
  tx.objectStore("qrStore").delete(id)
  tx.oncomplete=loadQR
}

/* ===================== POPUP ===================== */

function openPopup(){
  popup.style.display="block"
  modeChange()
}
function closePopup(){
  popup.style.display="none"
  qrTitle.value=""
  qrText.value=""
  tempImg=""
  generatedData=""
  generatedImage=""
  preview.innerHTML=""
}

/* ===================== SEARCH ===================== */

document.addEventListener("DOMContentLoaded",()=>{
  const search=document.getElementById("titleSearch")
  search.addEventListener("input",function(){
    const q=this.value.toLowerCase()
    document.querySelectorAll(".card").forEach(card=>{
      const t=card.querySelector(".cardTitle")
      if(!t) return
      card.style.display=t.innerText.toLowerCase().includes(q)?"block":"none"
    })
  })
})

/* ===================== PWA ===================== */

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./service-worker.js")
}

/* ===================== SWIPE FOR SETTINGS ===================== */

let startX=0, endX=0, edgeSwipe=false

document.addEventListener("touchstart",e=>{
  startX=e.changedTouches[0].screenX
  edgeSwipe = startX < 30
})

document.addEventListener("touchend",e=>{
  endX=e.changedTouches[0].screenX
  let diff=endX-startX
  if(edgeSwipe && diff>80){ openSettings() }
  if(diff<-80){ closeSettings() }
})

function openSettings(){ settingsPanel.classList.add("open") }
function closeSettings(){ settingsPanel.classList.remove("open") }

/* ===================== NAV ===================== */

function nextCard(){
  const container=document.getElementById("qrList")
  const c=container.querySelector(".card")
  if(!c) return
  container.scrollBy({ left:c.offsetWidth+22, behavior:"smooth" })
}

function prevCard(){
  const container=document.getElementById("qrList")
  const c=container.querySelector(".card")
  if(!c) return
  container.scrollBy({ left:-(c.offsetWidth+22), behavior:"smooth" })
}

function openScanner(){
  window.location.href="https://ordlysite.github.io/qr"
}
